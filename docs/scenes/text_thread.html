<!doctype html><meta charset="utf-8"><title>connection</title>
<style>
html,body{margin:0;background:#111;font-family:-apple-system,Segoe UI,Helvetica,Arial;overflow:hidden}
/* designed at 1280x720; the recorder zooms the page 1.5x to fill 1920x1080 */
#stage{position:relative;width:1280px;height:720px;overflow:hidden}
svg{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
.d{position:absolute;border-radius:50%;background:#37373b;width:10px;height:10px;margin:-5px 0 0 -5px;opacity:0;transition:opacity .8s,background .6s,transform .6s}
.d.on{opacity:1}
.d.hot{background:#e8825a;width:16px;height:16px;margin:-8px 0 0 -8px}
.d.warm{background:#8a5a46}
.pulse{animation:p 2.2s ease-out infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(232,130,90,.45)}100%{box-shadow:0 0 0 18px rgba(232,130,90,0)}}
.link{stroke:#e8825a;stroke-width:2.4;opacity:0;transition:opacity .7s,stroke .8s;stroke-linecap:round}
.link.on{opacity:.95}.link.faded{stroke:#4a4a4e;opacity:.5}
.try{stroke:#e8825a;stroke-width:2;stroke-dasharray:6 8;opacity:0;transition:opacity .55s}
.try.on{opacity:.7}
.lbl{position:absolute;color:#e6e0d8;font-size:16px;white-space:nowrap;opacity:0;transition:opacity .6s,color .6s;transform:translate(-50%,0)}
.lbl.on{opacity:1}.lbl.dim{color:#5d5d62}
.lbl.strike{text-decoration:line-through;color:#6b6b70}
.need{position:absolute;color:#e8a17a;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .6s;transform:translate(-50%,0)}
.need.on{opacity:1}.need.gone{opacity:.25;text-decoration:line-through;color:#6b6b70}
.card{position:absolute;width:186px;background:#1b1b1f;border:1px solid #33333a;border-radius:11px;padding:11px 13px;opacity:0;transition:opacity .7s;transform:translate(-50%,0)}
.card.on{opacity:1}
.card .h{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:#7d7d84;margin-bottom:8px}
.card .txt{font-size:14px;color:#cfc9c0;line-height:1.35}
.card .bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#4a3a33,#2c2c31);margin:6px 0;filter:blur(2.4px)}
#room{fill:none;stroke:#8f8f97;stroke-width:2;stroke-dasharray:7 8;opacity:0;transition:opacity .8s}
.ring{fill:none;stroke:#e8825a;stroke-width:2;opacity:0}
.ring.go{animation:r 1.9s ease-out infinite}
@keyframes r{0%{r:14px;opacity:.55}100%{r:92px;opacity:0}}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:#fff;font-size:28px;font-weight:700;opacity:0;transition:opacity 1s;padding:0 50px}
.cap.on{opacity:1}.cap b{color:#e8825a}
.work{position:absolute;color:#e8a17a;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .5s;transform:translate(-50%,0)}.work.on{opacity:1}.work.dim{opacity:.3}
</style>
<div id="stage"><svg id="svg"></svg><div class="cap" id="cap"></div></div>
<script>
const W=1280,H=720,stage=document.getElementById('stage'),svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';
const P={f1:[185,150],f2:[335,108],p1:[975,140],p2:[1105,212],j1:[200,562],j2:[338,622],
         u1:[938,592],u2:[1088,528],A:[520,330],B:[762,424],
         n1:[152,352],n2:[1132,368],n3:[648,556],loud:[872,246],k1:[356,214],k2:[452,286],k3:[300,300]};
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const taken=Object.values(P), greys=[];
for(let i=0;i<40;i++){let x,y,ok,t=0;
  do{x=W*(0.06+rnd()*0.88);y=H*(0.10+rnd()*0.80);
     ok=taken.every(p=>Math.hypot(x-p[0],y-p[1])>62)&&greys.every(p=>Math.hypot(x-p[0],y-p[1])>44);}while(!ok&&++t<600);
  if(ok)greys.push([x,y]);}
function dot(p,cls){const d=document.createElement('div');d.className='d'+(cls?' '+cls:'');d.style.left=p[0]+'px';d.style.top=p[1]+'px';stage.appendChild(d);return d;}
function line(a,b,cls){const l=document.createElementNS(NS,'line');l.setAttribute('class',cls);l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);svg.appendChild(l);return l;}
function lbl(p,text,dy,cls){const t=document.createElement('div');t.className=(cls||'lbl');t.style.left=p[0]+'px';t.style.top=(p[1]+dy)+'px';t.textContent=text;stage.appendChild(t);return t;}
const D={}; for(const k in P) D[k]=dot(P[k]);
const G=greys.map(p=>dot(p));
const at=(s,fn)=>setTimeout(fn,s*1000);

// cue points measured from the rendered narration (video/out/cues.json)
G.forEach((d,i)=>at(0.25+i*0.055,()=>d.classList.add('on')));
Object.values(D).forEach((d,i)=>at(0.45+i*0.055,()=>d.classList.add('on')));
// 0.00-9.55  a friend, a partner, a job nobody advertised, someone who understands what you're working on
const pairs=[['f1','f2','a friend',3.80],['p1','p2','a partner',4.55],['j1','j2','a job nobody advertised',5.30],['u1','u2','someone who understands your work',6.90]];
const madeLinks=[], madeLbls=[];
pairs.forEach(([a,b,text,t])=>{
  const l=line(P[a],P[b],'link'); madeLinks.push(l);
  const mid=[(P[a][0]+P[b][0])/2,(P[a][1]+P[b][1])/2];
  const L=lbl(mid,text,-30); madeLbls.push(L);
  at(t,()=>{D[a].classList.add('hot');D[b].classList.add('hot');l.classList.add('on');});
  at(t+0.35,()=>L.classList.add('on'));
});
// 9.73-16.00  the person you need is usually nearby, and you'll probably never meet them, and not because you didn't try
at(9.90,()=>{madeLinks.forEach(l=>l.classList.add('faded'));madeLbls.forEach(l=>l.classList.add('dim'));
              ['f1','f2','p1','p2','j1','j2','u1','u2'].forEach(k=>{D[k].classList.remove('hot');D[k].classList.add('warm');});});
at(10.40,()=>D.A.classList.add('hot','pulse'));
at(11.50,()=>D.B.classList.add('hot','pulse'));
const tryAB=line(P.A,P.B,'try');
at(12.40,()=>tryAB.classList.add('on'));
at(14.10,()=>tryAB.classList.remove('on'));
const fails=[[0,7],[3,11],[15,22],[9,26],[18,31],[5,29]].map(([i,j])=>line(P.A,greys[j%greys.length],'try'));
fails.forEach((l,i)=>{at(14.30+i*0.22,()=>l.classList.add('on'));at(15.30+i*0.22,()=>l.classList.remove('on'));});
// 16.18-21.26  people post every day that they're lonely, or looking for work, or building something
function post(p,text,dy){const c=document.createElement('div');c.className='card';c.style.left=p[0]+'px';c.style.top=(p[1]+dy)+'px';
  c.innerHTML='<div class="h">posted today</div><div class="txt">'+text+'</div>';stage.appendChild(c);return c;}
const posts=[['n1','feeling pretty lonely lately',-88,18.20],['n2','looking for work, anything in design',-88,19.35],['n3','building something, could use a hand',26,20.35]];
const postEls=posts.map(([k,t,dy,ts])=>{const c=post(P[k],t,dy);at(ts,()=>{c.classList.add('on');D[k].classList.add('hot');});return c;});
// 21.44-29.84  a post only works if the right person sees it, and even then they usually scroll past
const see=line(P.B,P.n1,'try');
at(22.60,()=>{D.B.classList.add('pulse');});
at(23.40,()=>see.classList.add('on'));
at(25.60,()=>{see.classList.remove('on');postEls[0].style.opacity='.35';});
at(27.40,()=>{const c=document.getElementById('cap');c.innerHTML='They scroll past without learning <b>how much they have in common</b>.';c.classList.add('on');});
// 30.02-38.32  being in the right place at the right time takes constant work: posting, making plans, chasing replies, trying to figure people out
at(30.10,()=>{document.getElementById('cap').classList.remove('on');postEls.forEach(c=>{c.classList.remove('on');c.style.opacity='';});['n1','n2','n3'].forEach(k=>D[k].classList.remove('hot'));D.B.classList.remove('pulse');});
const fan=[2,5,8,12,17,21,24,27,30,33,36,39,1,6,10,14].map(i=>line(P.A,greys[i%greys.length],'try'));
fan.forEach((l,i)=>{at(31.20+i*0.38,()=>l.classList.add('on'));at(32.60+i*0.38,()=>l.classList.remove('on'));});
const workSpec=[['posting',34.60],['making plans',35.40],['chasing replies',36.20],['trying to figure people out',37.20]];
const works=workSpec.map(([t,ts],i)=>{const w=lbl([520,196+i*27],t,0,'work');at(ts,()=>w.classList.add('on'));return w;});
// 38.50-42.70  it only works if you keep at it, and most people don't have the time
at(40.20,()=>{fan.forEach(l=>l.classList.remove('on'));works.forEach(w=>w.classList.add('dim'));});
at(40.50,()=>{const c=document.getElementById('cap');c.innerHTML='Most people <b>don\'t have the time</b>.';c.classList.add('on');});
</script>
